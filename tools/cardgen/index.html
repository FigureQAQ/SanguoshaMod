<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sanguosha Card Generator</title>
  <style>
    :root {
      --bg: #14100d;
      --panel: #211813;
      --gold: #e6b86f;
      --ink: #f8ead0;
      --muted: #baa98e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(218, 138, 47, .22), transparent 32rem),
        linear-gradient(135deg, #090706, var(--bg) 55%, #26140d);
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: minmax(320px, 520px) minmax(320px, 1fr);
      gap: 28px;
      width: min(1180px, calc(100vw - 32px));
      margin: 28px auto;
      align-items: start;
    }
    .panel {
      background: rgba(33, 24, 19, .88);
      border: 1px solid rgba(230, 184, 111, .35);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: var(--muted); line-height: 1.65; }
    label { display: grid; gap: 7px; margin: 14px 0; color: var(--gold); font-weight: 700; }
    input, select, textarea, button {
      width: 100%;
      border: 1px solid rgba(230, 184, 111, .35);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--ink);
      background: #120d0a;
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      cursor: pointer;
      margin-top: 10px;
      background: linear-gradient(135deg, #9e6325, #d8a452);
      color: #1c1008;
      font-weight: 900;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .preview-wrap { display: grid; justify-items: center; }
    canvas {
      width: min(512px, 100%);
      height: auto;
      border-radius: 28px;
      filter: drop-shadow(0 24px 34px rgba(0,0,0,.55));
    }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>本地牌面生成器</h1>
      <p>上传 AI 插画，填写字段，直接导出 PNG 或 JSON。所有处理都在本机完成。</p>
      <label>插画 <input id="art" type="file" accept="image/*" /></label>
      <label>牌名 <input id="title" value="诸葛连弩" /></label>
      <label>费用 <input id="cost" value="1" /></label>
      <label>类型 <input id="type" value="装备牌 - 武器" /></label>
      <label>稀有度
        <select id="rarity">
          <option>Common</option>
          <option>Uncommon</option>
          <option selected>Rare</option>
        </select>
      </label>
      <label>描述 <textarea id="description">获得力量并生成 1 张免费杀。每回合开始时，手牌中前若干张杀本回合变为 0 费。</textarea></label>
      <div class="actions">
        <button id="downloadPng">导出 PNG</button>
        <button id="downloadJson">导出 JSON</button>
      </div>
    </section>
    <section class="panel preview-wrap">
      <canvas id="card" width="512" height="768"></canvas>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const canvas = $('card');
    const ctx = canvas.getContext('2d');
    let artImage = null;

    const palette = { a: '#3b2418', b: '#b27a35', c: '#f6d18a', glow: '#f0a742' };

    function wrapText(text, maxUnits) {
      const chars = String(text || '').replace(/\s+/g, ' ').trim().split('');
      const lines = [];
      let line = '';
      const width = (s) => [...s].reduce((sum, ch) => sum + (/[\x00-\x7f]/.test(ch) ? .55 : 1), 0);
      for (const ch of chars) {
        const next = line + ch;
        if (width(next) > maxUnits && line) {
          lines.push(line.trimEnd());
          line = ch.trimStart();
        } else {
          line = next;
        }
      }
      if (line.trim()) lines.push(line.trimEnd());
      return lines;
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function draw() {
      const title = $('title').value;
      const cost = $('cost').value;
      const type = $('type').value;
      const rarity = $('rarity').value;
      const description = $('description').value;

      ctx.clearRect(0, 0, 512, 768);
      let bg = ctx.createLinearGradient(0, 0, 512, 768);
      bg.addColorStop(0, palette.a);
      bg.addColorStop(.55, '#17100d');
      bg.addColorStop(1, '#050403');
      ctx.fillStyle = '#050403';
      ctx.fillRect(0, 0, 512, 768);
      roundRect(18, 18, 476, 732, 42);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = palette.b;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(70, 72, 38, 0, Math.PI * 2);
      ctx.fillStyle = palette.b;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = palette.c;
      ctx.stroke();
      ctx.fillStyle = '#fff8df';
      ctx.font = '900 38px Georgia, Microsoft YaHei';
      ctx.textAlign = 'center';
      ctx.fillText(cost, 70, 86);

      ctx.font = '900 40px Microsoft YaHei';
      ctx.strokeStyle = '#1b0b04';
      ctx.lineWidth = 6;
      ctx.fillStyle = '#fff4d4';
      ctx.strokeText(title, 256, 78);
      ctx.fillText(title, 256, 78);

      roundRect(44, 106, 424, 314, 26);
      ctx.fillStyle = '#130b08';
      ctx.fill();
      ctx.strokeStyle = palette.c;
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.save();
      roundRect(50, 112, 412, 302, 22);
      ctx.clip();
      if (artImage) {
        const scale = Math.max(412 / artImage.width, 302 / artImage.height);
        const w = artImage.width * scale;
        const h = artImage.height * scale;
        ctx.drawImage(artImage, 50 + (412 - w) / 2, 112 + (302 - h) / 2, w, h);
      } else {
        const artBg = ctx.createLinearGradient(50, 112, 462, 414);
        artBg.addColorStop(0, palette.b);
        artBg.addColorStop(1, '#16110e');
        ctx.fillStyle = artBg;
        ctx.fillRect(50, 112, 412, 302);
        ctx.fillStyle = palette.c;
        ctx.font = '900 34px Microsoft YaHei';
        ctx.fillText(title, 256, 270);
      }
      ctx.restore();

      roundRect(50, 438, 412, 42, 12);
      ctx.fillStyle = '#1b100b';
      ctx.fill();
      ctx.strokeStyle = palette.c;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = palette.c;
      ctx.font = '800 25px Microsoft YaHei';
      ctx.fillText(`${type} · ${rarity}`, 256, 468);

      roundRect(44, 490, 424, 214, 20);
      ctx.fillStyle = '#efe0bd';
      ctx.fill();
      ctx.strokeStyle = '#3a1d10';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.textAlign = 'left';
      ctx.fillStyle = '#24160e';
      ctx.font = '700 26px Microsoft YaHei';
      wrapText(description, 15).slice(0, 8).forEach((line, i) => ctx.fillText(line, 56, 532 + i * 34));
    }

    function download(filename, href) {
      const a = document.createElement('a');
      a.href = href;
      a.download = filename;
      a.click();
    }

    $('art').addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => { artImage = image; draw(); };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
    ['title', 'cost', 'type', 'rarity', 'description'].forEach(id => $(id).addEventListener('input', draw));
    $('downloadPng').addEventListener('click', () => download(`${$('title').value || 'card'}.png`, canvas.toDataURL('image/png')));
    $('downloadJson').addEventListener('click', () => {
      const data = {
        object: 'sanguosha-card',
        title: $('title').value,
        cost: $('cost').value,
        type: $('type').value,
        rarity: $('rarity').value,
        description: $('description').value
      };
      download(`${$('title').value || 'card'}.json`, URL.createObjectURL(new Blob([JSON.stringify(data, null, 2) + '\n'], { type: 'application/json' })));
    });
    draw();
  </script>
</body>
</html>
